<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;display=swap');
      .logo-text {
        font-family: 'Anton', 'Oswald', -apple-system, sans-serif;
        font-size: 88px;
        font-weight: 900;
        fill: #ffffff;
        text-anchor: start;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        line-height: 0.9;
      }
      .dot-accent {
        fill: #ffe410;
      }
    </style>
  </defs>
  
  <!-- Stacked Monolithic Typography -->
  <text x="20" y="90" class="logo-text">NOT</text>
  <text x="20" y="176" class="logo-text">AMANTHA</text>
  <text x="20" y="262" class="logo-text">PERERA</text>
  
  <!-- Electric Yellow Accent Dot/Square -->
  <rect x="290" y="238" width="24" height="24" class="dot-accent" rx="2" />
</svg>
